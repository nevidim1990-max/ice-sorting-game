<script>
'use strict';

/* ============================================================
   ENGINE CONFIG (technical, not game content)
   ============================================================ */
const ENGINE_CONFIG = Object.freeze({
  version: '1.0.0',
  debug: new URLSearchParams(location.search).get('debug') === '1',
  grid: { cellSize: 44, padding: 14 },
  fixedDt: 1 / 60,
  layers: {
    background: { z: -100, collision: false },
    gameplay:   { z: 0,    collision: true  },
    foreground: { z: 100,  collision: false },
    ui:         { z: 1000, collision: false }
  },
  inputRepeatDelay: 110
});

/* ============================================================
   UTILS
   ============================================================ */
const U = {
  clamp: (v,a,b)=>Math.max(a,Math.min(b,v)),
  rand: (a,b)=>a+Math.random()*(b-a),
  uid: (()=>{let n=0;return (p='e')=>`${p}_${++n}`;})(),
  deepClone: (o)=>JSON.parse(JSON.stringify(o)),
  dirs: { up:{dr:-1,dc:0}, down:{dr:1,dc:0}, left:{dr:0,dc:-1}, right:{dr:0,dc:1} },
  opposite: { up:'down', down:'up', left:'right', right:'left' }
};

/* ============================================================
   EVENT BUS (Layer 3)
   ============================================================ */
class EventBus {
  constructor(){ this.sync = new Map(); this.queue = []; }
  on(type, fn){ if(!this.sync.has(type)) this.sync.set(type,new Set()); this.sync.get(type).add(fn);
    return ()=>this.off(type,fn); }
  off(type, fn){ const s=this.sync.get(type); if(s) s.delete(fn); }
  emit(type, payload){ const s=this.sync.get(type); if(s) for(const fn of [...s]){ try{ fn(payload); }catch(e){ this.emit('ERROR_REPORTED',{source:'EventBus',msg:e.message,stack:e.stack}); } } }
  defer(type, payload){ this.queue.push({type,payload}); }
  flush(){ const q=this.queue; this.queue=[]; for(const {type,payload} of q){ this.emit(type,payload); } }
}
const bus = new EventBus();

/* ============================================================
   REGISTRY
   ============================================================ */
class Registry {
  constructor(){ this.maps = {}; }
  bucket(name){ if(!this.maps[name]) this.maps[name]=new Map(); return this.maps[name]; }
  set(bucket, id, value){ this.bucket(bucket).set(id, value); }
  get(bucket, id){ return this.bucket(bucket).get(id); }
  all(bucket){ return [...this.bucket(bucket).values()]; }
  keys(bucket){ return [...this.bucket(bucket).keys()]; }
  has(bucket, id){ return this.bucket(bucket).has(id); }
}
const registry = new Registry();

/* ============================================================
   ECS CORE (Layer 1)
   ============================================================ */
class World {
  constructor(){
    this.entities = new Map();   // id -> { id, components: {} }
    this.nextId = 1;
    this.grid = null;            // { rows, cols, cells: [ [cell] ] }
    this.gridIndex = new Map();  // "r,c" -> Set(entityId)
  }
  createEntity(components = {}){
    const id = 'e'+(this.nextId++);
    const e = { id, components: {} };
    for(const k in components) e.components[k] = components[k];
    this.entities.set(id, e);
    if(e.components.GridPosition) this._index(e);
    return e;
  }
  destroyEntity(id){
    const e = this.entities.get(id); if(!e) return;
    this._unindex(e);
    this.entities.delete(id);
  }
  addComponent(id, name, data){
    const e = this.entities.get(id); if(!e) return;
    e.components[name] = data || {};
    if(name==='GridPosition') this._index(e);
  }
  removeComponent(id, name){
    const e = this.entities.get(id); if(!e) return;
    if(name==='GridPosition') this._unindex(e);
    delete e.components[name];
  }
  _index(e){
    const gp = e.components.GridPosition;
    const key = gp.row+','+gp.col;
    if(!this.gridIndex.has(key)) this.gridIndex.set(key, new Set());
    this.gridIndex.get(key).add(e.id);
  }
  _unindex(e){
    const gp = e.components.GridPosition; if(!gp) return;
    const key = gp.row+','+gp.col;
    const s = this.gridIndex.get(key); if(s){ s.delete(e.id); if(!s.size) this.gridIndex.delete(key); }
  }
  moveGrid(e, row, col){
    this._unindex(e);
    e.components.GridPosition.row = row;
    e.components.GridPosition.col = col;
    this._index(e);
  }
  query(names){
    const out = [];
    for(const e of this.entities.values()){
      let ok = true;
      for(const n of names){ if(!(n in e.components)){ ok=false; break; } }
      if(ok) out.push(e);
    }
    return out;
  }
  first(names){ for(const e of this.entities.values()){ let ok=true; for(const n of names){ if(!(n in e.components)){ok=false;break;} } if(ok) return e; } return null; }
  at(row, col){
    const s = this.gridIndex.get(row+','+col);
    return s ? [...s].map(id => this.entities.get(id)) : [];
  }
  atWith(row, col, name){
    return this.at(row,col).filter(e => name in e.components);
  }
  clear(){ this.entities.clear(); this.gridIndex.clear(); this.nextId=1; }
}

/* ============================================================
   MODIFIER STACK (Layer 5)
   ============================================================ */
class ModifierStack {
  constructor(){ this.entries = []; }
  add(mod){ this.entries.push({ priority:0, stacking:'add', scope:'instant', duration:0, source:'unknown', ...mod }); }
  clearByScope(scope){ this.entries = this.entries.filter(m => m.scope !== scope); }
  tick(dt){ for(const m of this.entries){ if(m.duration>0){ m.duration-=dt; } } this.entries = this.entries.filter(m => m.duration===undefined || m.duration<=0 || m.duration>0 ? !(m.duration<=0 && m.scope==='turn') : true); }
  compute(base, target){
    const relevant = this.entries.filter(m => !m.target || m.target===target);
    let flat=0, mult=1, cond=0;
    for(const m of relevant){
      if(m.kind==='flat') flat += (m.value||0);
      else if(m.kind==='percent') mult *= (1 + (m.value||0));
      else if(m.kind==='multiplier') mult *= (m.value||1);
      else if(m.kind==='conditional') cond += (m.value||0);
    }
    let v = (base + flat) * mult + cond;
    if(base !== undefined && target && typeof base === 'number'){
      const cap = relevant.find(m=>m.cap!==undefined);
      if(cap) v = Math.min(v, cap.cap);
    }
    return v;
  }
}
const modifiers = new ModifierStack();

/* ============================================================
   RULE ENGINE (Layer 4)
   ============================================================ */
class RuleEngine {
  constructor(world){ this.world = world; this.rules = []; }
  load(rules){ this.rules = [...rules].sort((a,b)=> (b.priority||0)-(a.priority||0)); }
  evaluate(context){
    const w = this.world;
    for(const rule of this.rules){
      if(rule._cd && rule._cd > 0){ rule._cd--; continue; }
      if(this._match(rule.condition||[], context, w)){
        this._apply(rule.effect||[], context, w, rule);
        if(rule.cooldown) rule._cd = rule.cooldown;
      }
    }
  }
  _match(conds, ctx, w){
    for(const c of conds){ if(!this._cond(c, ctx, w)) return false; }
    return true;
  }
  _cond(c, ctx, w){
    const target = c.target === 'self' && ctx.entity ? ctx.entity : ctx.entity;
    switch(c.type){
      case 'HasComponent': return target && c.component in target.components;
      case 'HasTag': return target && c.tag in target.components;
      case 'ValueCompare': {
        const v = this._readPath(target, c.path);
        switch(c.op){ case '>': return v > c.value; case '>=': return v >= c.value; case '<': return v < c.value; case '<=': return v <= c.value; case '==': return v == c.value; case '!=': return v != c.value; }
        return false;
      }
      case 'GridCellType': {
        if(!target || !target.components.GridPosition) return false;
        const gp = target.components.GridPosition;
        const cell = w.grid ? w.grid.cells[gp.row]?.[gp.col] : null;
        if(!cell) return false;
        if(c.cell === 'goal') return !!cell.goal;
        if(c.cell === 'not_goal') return !cell.goal;
        if(c.cell === 'wall') return cell.wall === true;
        return false;
      }
      case 'AdjacentEntity': {
        if(!target || !target.components.GridPosition) return false;
        const gp = target.components.GridPosition;
        const [hr, hc] = c.left_or_right === 'wall' ? [0,1] : [1,0];
        const left = w.at(gp.row, gp.col - 1), right = w.at(gp.row, gp.col + 1);
        const up = w.at(gp.row - 1, gp.col), down = w.at(gp.row + 1, gp.col);
        const isWallSet = (arr) => arr.some(e => 'WallTag' in e.components) || (w.grid && w.grid.cells[arr[0]?.components?.GridPosition?.row ?? -1]?.[0]?.wall === true);
        if(c.up_or_down === 'wall'){
          const upWall = (w.grid && w.grid.cells[gp.row-1]?.[gp.col]?.wall) || up.some(e=>'WallTag' in e.components);
          const downWall = (w.grid && w.grid.cells[gp.row+1]?.[gp.col]?.wall) || down.some(e=>'WallTag' in e.components);
          const leftWall = (w.grid && w.grid.cells[gp.row]?.[gp.col-1]?.wall) || left.some(e=>'WallTag' in e.components);
          const rightWall = (w.grid && w.grid.cells[gp.row]?.[gp.col+1]?.wall) || right.some(e=>'WallTag' in e.components);
          if(upWall && downWall) return true;
          if(leftWall && rightWall) return true;
        }
        return false;
      }
      case 'MoveBudgetCompare': return ctx.moves > (c.value ?? 0);
      default: return false;
    }
  }
  _apply(effects, ctx, w, rule){
    for(const ef of effects){
      switch(ef.type){
        case 'EmitEvent': bus.defer(ef.event, this._resolve(ef.payload, ctx, w)); break;
        case 'ModifyComponent': {
          const t = ctx.entity; if(!t) break;
          const comp = t.components[ef.component]; if(!comp) break;
          comp[ef.field] = this._resolve({v:ef.value}, ctx, w).v;
          break;
        }
        case 'ApplyModifier': modifiers.add(this._resolve(ef.modifier, ctx, w)); break;
        case 'TriggerJuice': bus.defer('JUICE_TRIGGERED', { preset: ef.preset, entity: ctx.entity?.id }); break;
        default: break;
      }
    }
  }
  _resolve(payload, ctx, w){
    if(!payload) return payload;
    const out = Array.isArray(payload) ? [] : {};
    for(const k in payload){
      let v = payload[k];
      if(v === '$self') v = ctx.entity?.id;
      else if(typeof v === 'string' && v.startsWith('$event.')) v = ctx.event?.[v.slice(7)];
      out[k] = v;
    }
    return out;
  }
  _readPath(obj, path){
    if(!obj) return undefined;
    const parts = path.split('.');
    let cur = obj;
    for(const p of parts){ if(cur == null) return undefined; cur = cur[p]; }
    return cur;
  }
}

/* ============================================================
   FSM (Layer 6)
   ============================================================ */
class FSM {
  constructor(id, states, initial, transitions){
    this.id = id; this.states = new Set(states); this.state = initial; this.transitions = transitions; this.listeners = [];
  }
  can(next){ return this.transitions.some(t => t.from === this.state && t.to === next); }
  go(next, ctx){
    if(!this.can(next)) return false;
    const t = this.transitions.find(t => t.from === this.state && t.to === next);
    if(t.guard && !t.guard(ctx)) return false;
    const prev = this.state;
    this.state = next;
    t.onEnter && t.onEnter(prev, ctx);
    for(const l of this.listeners) l(next, prev);
    bus.defer('FSM_TRANSITION', { fsm: this.id, from: prev, to: next });
    return true;
  }
  onChange(fn){ this.listeners.push(fn); }
}

/* ============================================================
   SAVE SYSTEM
   ============================================================ */
class SaveSystem {
  constructor(key, version = 1){ this.key = key; this.version = version; this.data = null; }
  defaults(){
    return {
      version: this.version,
      progression: { completedMicros: {}, stars: {}, currency: 0, unlockedModifiers: [] },
      meta: { achievements: {}, dailyDone: null, endlessBest: 0 },
      settings: { music: 0.7, sfx: 0.8, fx: 'med', musicOn: true, sfxOn: true },
      activeModifiers: [],
      checkpoint: null,
      stats: { totalMoves: 0, totalPushes: 0, totalUndos: 0, totalPuzzlesCleared: 0 }
    };
  }
  load(){
    try {
      const raw = localStorage.getItem(this.key);
      if(!raw){ this.data = this.defaults(); return this.data; }
      const parsed = JSON.parse(raw);
      this.data = this._migrate(parsed);
    } catch(e){
      bus.emit('ERROR_REPORTED', { source: 'SaveSystem', msg: e.message, recovery: 'reset_defaults' });
      this.data = this.defaults();
    }
    return this.data;
  }
  _migrate(d){
    if(!d || typeof d !== 'object') return this.defaults();
    if(d.version !== this.version){
      const merged = { ...this.defaults(), ...d };
      merged.version = this.version;
      return merged;
    }
    return { ...this.defaults(), ...d };
  }
  save(){ try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch(e){ bus.emit('ERROR_REPORTED',{source:'SaveSystem',msg:e.message}); } }
  reset(){ this.data = this.defaults(); this.save(); }
}
let save;

/* ============================================================
   PLATFORM ADAPTER
   ============================================================ */
const PlatformAdapter = {
  name: 'local',
  init(){ bus.emit('PLATFORM_INITIALIZED', { name: this.name }); },
  gameplayStart(){ /* no-op */ },
  gameplayStop(){ /* no-op */ },
  isAdAvailable(){ return false; },
  rewardAd(){ bus.emit('AD_RESULT', { ok: false, reason: 'not_supported' }); return Promise.resolve({ ok:false }); },
  interstitialAd(){ return Promise.resolve({ ok:false }); },
  submitScore(){ return Promise.resolve(); }
};

/* ============================================================
   DATA VALIDATION
   ============================================================ */
function validateGameData(data){
  const issues = [];
  if(!data || typeof data !== 'object'){ issues.push({severity:'error', msg:'GAME_DATA is not an object'}); return { ok:false, issues }; }
  if(!data.theme) issues.push({severity:'warn', msg:'missing theme', recovery:'use default palette'});
  else {
    if(!data.theme.palette || !Array.isArray(data.theme.palette)) issues.push({severity:'warn', msg:'theme.palette missing', recovery:'fallback'});
    if(!data.theme.texts) issues.push({severity:'warn', msg:'theme.texts missing', recovery:'fallback'});
  }
  if(!data.entities) issues.push({severity:'error', msg:'entities missing', recovery:'inject synthetics'});
  if(!data.progression || !Array.isArray(data.progression.stages) || !data.progression.stages.length)
    issues.push({severity:'error', msg:'progression.stages empty', recovery:'inject synthetics'});
  return { ok: !issues.some(i=>i.severity==='error'), issues };
}

/* ============================================================
   GAME ORCHESTRATOR (owns scene, systems, world, fsm)
   ============================================================ */
class Game {
  constructor(){
    this.world = new World();
    this.ruleEngine = new RuleEngine(this.world);
    this.scene = null;
    this.gridPx = { cell: ENGINE_CONFIG.grid.cellSize, pad: ENGINE_CONFIG.grid.padding };
    this.level = null;        // active micro_level
    this.stage = null;        // active stage
    this.microIndex = 0;
    this.history = [];        // undo stack of snapshots
    this.session = { moves:0, pushes:0, undos:0, startedAt:0, hintsUsed:0 };
    this.playerId = null;
    this.stateFSM = new FSM('level', ['IDLE','PLAYING','WIN_PENDING','WON','LOST_DEADLOCK'], 'IDLE', [
      { from: 'IDLE', to: 'PLAYING' },
      { from: 'PLAYING', to: 'WIN_PENDING' },
      { from: 'WIN_PENDING', to: 'WON' },
      { from: 'PLAYING', to: 'LOST_DEADLOCK' },
      { from: 'WON', to: 'PLAYING' },
      { from: 'LOST_DEADLOCK', to: 'PLAYING' }
    ]);
    this.decorations = [];
    this.spriteMap = new Map();   // entityId -> Phaser sprite
    this.decoSprites = [];
    this.tutorialState = { played: new Set() };
  }

  /* -------- Init: data → world → scene -------- */
  init(ph){
    this.phaser = ph;
    this.scene = new Phaser.Scene({ key: 'game' });
    this.scene.create = () => this.onSceneCreate();
    this.scene.update = (t, dt) => this.onSceneUpdate(dt);
  }

  loadStage(stageIndex){
    const stage = GAME_DATA.progression.stages[stageIndex];
    if(!stage) return;
    this.stage = stage;
    this.microIndex = 0;
    this.loadMicro(stage.micro_phases[0]);
  }

  loadMicro(microLevel){
    this.level = microLevel;
    this.session = { moves:0, pushes:0, undos:0, startedAt: performance.now(), hintsUsed:0 };
    this.history = [];
    this.stateFSM.state = 'PLAYING';

    // Reset world
    this.world.clear();
    this.spriteMap.forEach(s=>s.destroy && s.destroy());
    this.spriteMap.clear();
    this.decoSprites.forEach(s=>s.destroy && s.destroy());
    this.decoSprites = [];
    this.decorations = [];

    // Build grid + gameplay entities + decorations
    this.buildGrid(microLevel);
    this.buildGameplay(microLevel);
    this.buildDecorations(microLevel);

    // UI/HUD update
    UIRefreshHUD();
    bus.defer('GAMEPLAY_START', { stage: this.stage.stage_id, micro: microLevel.micro_level_id });
    Tutorial.onMicroStart(microLevel);
    // save mid-stage checkpoint
    if(save){
      save.data.checkpoint = { stageId: this.stage.stage_id, microId: microLevel.micro_level_id, session: {...this.session} };
      save.save();
    }
  }

  buildGrid(ml){
    const { rows, cols } = ml.spatial_extent;
    const cells = [];
    for(let r=0;r<rows;r++){
      const row = [];
      for(let c=0;c<cols;c++){
        row.push({ wall: false, goal: false });
      }
      cells.push(row);
    }
    this.world.grid = { rows, cols, cells };
  }

  buildGameplay(ml){
    const eg = registry.all('entities').reduce((acc,e)=>{ acc[e.id]=e; return acc; }, {});
    for(const item of ml.entities_in_zone){
      const def = eg[item.entity_id] || registry.get('entities', item.entity_id);
      const count = Math.max(1, item.instance_count||1);
      for(let i=0;i<count;i++){
        // For walls with instance_count N, we place N copies — but data uses row/col as anchor.
        // We stagger placement by grid scan order for multiples.
        const [r, c] = this._stagger(item.row, item.col, i, this.world.grid);
        const comps = U.deepClone(def.components || {});
        // Tags come from component set itself
        comps.GridPosition = { row: r, col: c };
        if(def.visual) comps.Sprite.visual = def.visual;
        if(def.animation_class) comps.Animation = { idle: def.animation_class === 'anim-idle', hover: def.animation_class === 'anim-hover', interact: def.interaction_class === 'anim-squash' || def.interaction_class === 'anim-flash' };
        if(def.interaction_class) comps.Sprite.interactionClass = def.interaction_class;
        const e = this.world.createEntity(comps);
        if('PlayerTag' in comps) this.playerId = e.id;
        if('GoalTag' in comps) this.world.grid.cells[r][c].goal = true;
        if('WallTag' in comps) this.world.grid.cells[r][c].wall = true;
        this.spawnSpriteForEntity(e);
      }
    }
  }

  _stagger(row, col, index, grid){
    if(index === 0) return [row, col];
    // Scan nearby empty cells around anchor
    for(let dr=-2; dr<=2; dr++){
      for(let dc=-2; dc<=2; dc++){
        const r = row+dr, c = col+dc;
        if(r<=0||c<=0||r>=grid.rows-1||c>=grid.cols-1) continue;
        const occupied = this.world.atWith(r,c,'WallTag').length > 0 || this.world.atWith(r,c,'PushableTag').length > 0;
        if(!occupied && grid.cells[r][c]) return [r,c];
      }
    }
    return [row, col];
  }

  buildDecorations(ml){
    const deco = ml.decorative_layout || [];
    const eg = registry.all('entities').reduce((acc,e)=>{ acc[e.id]=e; return acc; }, {});
    for(const d of deco){
      const def = eg[d.entity_id] || registry.get('entities', d.entity_id);
      const count = Math.max(1, d.instance_count||1);
      const layer = this._layerFromDeco(d.render_layer);
      for(let i=0;i<count;i++){
        const pos = this._decoPos(d, i, layer);
        const visual = def?.visual || { shape: 'circle', color: '#666' };
        const sprite = this._createShape(pos.x, pos.y, visual, layer, d.z_index, true);
        sprite.decoData = { parallax: d.parallax_factor || 0, layer, baseX: pos.x, baseY: pos.y, z: d.z_index || 0 };
        this.decoSprites.push(sprite);
        this.decorations.push({ sprite, def, d });
      }
    }
    // sort by z_index within layer
    this.decoSprites.sort((a,b)=> (a.decoData.z||0) - (b.decoData.z||0));
    this.decoSprites.forEach(s => s.setDepth((s.decoData.layer==='background' ? -100 : 100) + (s.decoData.z||0)));
  }

  _layerFromDeco(renderLayer){
    if(renderLayer === 'foreground') return 'foreground';
    return 'background';
  }

  _decoPos(d, i, layer){
    const grid = this.world.grid;
    const cell = this.gridPx.cell, pad = this.gridPx.pad;
    const W = grid.cols * cell + pad*2, H = grid.rows * cell + pad*2;
    if(d.row !== null && d.row !== undefined && d.col !== null && d.col !== undefined){
      const jitter = i === 0 ? [0,0] : [ (Math.random()-0.5)*cell*0.6, (Math.random()-0.5)*cell*0.6 ];
      return {
        x: pad + d.col * cell + cell/2 + jitter[0],
        y: pad + d.row * cell + cell/2 + jitter[1]
      };
    }
    return { x: Math.random()*W, y: Math.random()*H };
  }

  spawnSpriteForEntity(e){
    const comps = e.components;
    if(!comps.GridPosition || !comps.Sprite) return;
    const layer = comps.RenderLayer?.layer || 'gameplay';
    const z = comps.RenderLayer?.z || 0;
    const gp = comps.GridPosition;
    const { x, y } = this._gridToPx(gp.row, gp.col);
    const visual = comps.Sprite.visual || { shape:'square', color:'#4a83ff' };
    const sprite = this._createShape(x, y, visual, layer, z, false);
    sprite.entityId = e.id;
    sprite.setDepth(z);
    this.spriteMap.set(e.id, sprite);

    // Micro-animations (Tweens, no new assets)
    const anim = comps.Animation || {};
    if(anim.idle){
      this.scene.tweens.add({ targets: sprite, y: y - 3, duration: 900 + Math.random()*400, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    }
    if(anim.hover){
      sprite.setInteractive({ useHandCursor: true });
      sprite.on('pointerover', ()=> this.scene.tweens.add({ targets: sprite, scale: 1.1, duration: 150 }));
      sprite.on('pointerout', ()=> this.scene.tweens.add({ targets: sprite, scale: 1.0, duration: 150 }));
    }
    if(anim.interact){
      sprite.setInteractive({ useHandCursor: true });
      sprite.on('pointerdown', ()=>{
        this.scene.tweens.add({ targets: sprite, scaleX: 0.9, scaleY: 1.1, duration: 90, yoyo: true,
          onComplete: ()=> this.scene.tweens.add({ targets: sprite, scale: 1, duration: 80 }) });
      });
    }
  }

  _gridToPx(r, c){
    const cell = this.gridPx.cell, pad = this.gridPx.pad;
    return { x: pad + c*cell + cell/2, y: pad + r*cell + cell/2 };
  }

  _createShape(x, y, visual, layer, z, isDeco){
    const { shape='square', color='#4a83ff' } = visual;
    const cell = this.gridPx.cell;
    const size = isDeco ? cell*0.7 : cell*0.78;
    const g = this.scene.add.graphics();
    g.fillStyle(Phaser.Display.Color.HexStringToColor(color).color, 1);
    switch(shape){
      case 'circle':   g.fillCircle(0,0,size/2); break;
      case 'triangle': g.fillTriangle(0,-size/2, size/2,size/2, -size/2,size/2); break;
      case 'diamond':  g.fillPoints([{x:0,y:-size/2},{x:size/2,y:0},{x:0,y:size/2},{x:-size/2,y:0}], true); break;
      default:         g.fillRoundedRect(-size/2, -size/2, size, size, 6); break;
    }
    if(!isDeco){ g.lineStyle(2, 0x000000, 0.25); g.strokeRect(-size/2, -size/2, size, size); }
    g.x = x; g.y = y;
    g.setDepth(z || 0);
    return g;
  }

  onSceneCreate(){
    // nothing on create; we re-render on loadMicro
  }

  onSceneUpdate(dt){
    // Parallax for decorations
    const cam = this.scene.cameras.main;
    for(const s of this.decoSprites){
      const d = s.decoData;
      if(d.parallax > 0){
        s.x = d.baseX - (cam.scrollX * d.parallax);
        s.y = d.baseY - (cam.scrollY * d.parallax);
      }
    }
    modifiers.tick(dt/1000);
  }

  /* -------- Move pipeline -------- */
  attemptMove(dir){
    if(this.stateFSM.state !== 'PLAYING') return;
    const cmd = { dir, source: 'input' };
    bus.emit('MOVE_ATTEMPTED', cmd);
    const player = this.world.entities.get(this.playerId);
    if(!player) return;
    const gp = player.components.GridPosition;
    const d = U.dirs[dir];
    const nr = gp.row + d.dr, nc = gp.col + d.dc;
    if(!this._inBounds(nr, nc) || this.world.grid.cells[nr][nc].wall){ bus.defer('MOVE_REJECTED', { reason:'wall' }); return; }
    const blockers = this.world.atWith(nr, nc, 'PushableTag');
    if(blockers.length){
      const box = blockers[0];
      const br = nr + d.dr, bc = nc + d.dc;
      if(!this._inBounds(br,bc) || this.world.grid.cells[br][bc].wall || this.world.atWith(br,bc,'PushableTag').length){
        bus.defer('PUSH_BLOCKED', { dir }); bus.defer('MOVE_REJECTED', { reason:'push_blocked' }); return;
      }
      // Snapshot for undo
      this.history.push(this._snapshot());
      this.world.moveGrid(box, br, bc);
      this.session.pushes++;
      const bs = this.spriteMap.get(box.id);
      if(bs){ const { x, y } = this._gridToPx(br,bc); this.scene.tweens.add({ targets: bs, x, y, duration: 110, ease: 'Quad.easeOut' }); }
      bus.defer('PUSH_COMMITTED', { dir, boxId: box.id });
      Juice.onPush(this.scene, this.spriteMap.get(box.id));
    } else {
      this.history.push(this._snapshot());
    }
    this.world.moveGrid(player, nr, nc);
    this.session.moves++;
    const ps = this.spriteMap.get(this.playerId);
    if(ps){ const { x, y } = this._gridToPx(nr,nc); this.scene.tweens.add({ targets: ps, x, y, duration: 90, ease: 'Quad.easeOut' }); }
    bus.defer('MOVE_COMMITTED', { dir, playerId: this.playerId });
    Juice.onMove(this.scene);
    // Rule engine
    this.ruleEngine.evaluate({ entity: player, event: { dir }, moves: this.session.moves });
    // Goals
    this.checkGoals();
    UIRefreshHUD();
    Tutorial.onEvent('move', this.session);
  }

  _inBounds(r,c){ const g=this.world.grid; return r>=0 && c>=0 && r<g.rows && c<g.cols; }

  _snapshot(){
    const s = { moves: [], session: { ...this.session } };
    for(const e of this.world.entities.values()){
      if(e.components.GridPosition){
        s.moves.push({ id: e.id, row: e.components.GridPosition.row, col: e.components.GridPosition.col });
      }
    }
    return s;
  }

  undo(){
    if(this.stateFSM.state !== 'PLAYING') return;
    if(!this.history.length){ bus.defer('UNDO_EMPTY', {}); return; }
    const tokens = this._undoTokens();
    if(tokens <= 0){ bus.defer('UNDO_EMPTY', { reason: 'no_tokens' }); return; }
    const snap = this.history.pop();
    for(const m of snap.moves){
      const e = this.world.entities.get(m.id); if(!e || !e.components.GridPosition) continue;
      this.world.moveGrid(e, m.row, m.col);
      const sp = this.spriteMap.get(m.id);
      if(sp){ const { x, y } = this._gridToPx(m.row, m.col); this.scene.tweens.add({ targets: sp, x, y, duration: 80 }); }
    }
    this.session.undos++;
    this.session.moves = snap.session.moves;
    this.session.pushes = snap.session.pushes;
    bus.defer('UNDO_PERFORMED', {});
    UIRefreshHUD();
    this.checkGoals(true);
  }

  _undoTokens(){
    let base = 3;
    return Math.max(0, Math.floor(modifiers.compute(base, 'undoTokens')) - this.session.undos);
  }

  checkGoals(isAfterUndo){
    const boxes = this.world.query(['PushableTag','GridPosition']);
    const goals = this.world.query(['GoalTag','GridPosition']);
    if(!boxes.length || !goals.length) return;
    let onGoal = 0;
    for(const b of boxes){
      const gp = b.components.GridPosition;
      const cell = this.world.grid.cells[gp.row]?.[gp.col];
      if(cell?.goal) onGoal++;
    }
    if(onGoal === boxes.length){
      this.stateFSM.go('WIN_PENDING');
      bus.defer('MICRO_PHASE_COMPLETED', { microId: this.level.micro_level_id, moves: this.session.moves, pushes: this.session.pushes, undos: this.session.undos });
      Juice.onWin(this.scene);
      setTimeout(()=> this.onMicroComplete(), 550);
    } else if(!isAfterUndo){
      // deadlock soft warning via RuleEngine rule
    }
  }

  onMicroComplete(){
    const stage = this.stage;
    const ml = this.level;
    const stars = this._computeStars(ml);
    // persist
    if(save){
      save.data.progression.completedMicros[ml.micro_level_id] = true;
      save.data.progression.stars[ml.micro_level_id] = Math.max(save.data.progression.stars[ml.micro_level_id] || 0, stars);
      save.data.progression.currency += 5 + stars*3;
      save.data.stats.totalMoves += this.session.moves;
      save.data.stats.totalPushes += this.session.pushes;
      save.data.stats.totalUndos += this.session.undos;
      save.data.stats.totalPuzzlesCleared += 1;
      save.save();
    }
    Achievements.evaluate('MICRO_PHASE_COMPLETED', { ml, session: this.session, stars });
    // next micro or end stage
    const phases = stage.micro_phases;
    if(this.microIndex + 1 < phases.length){
      this.microIndex++;
      this.loadMicro(phases[this.microIndex]);
      UIShow('hud');
    } else {
      bus.defer('STAGE_COMPLETED', { stageId: stage.stage_id });
      Achievements.evaluate('STAGE_COMPLETED', { stage });
      this.stateFSM.state = 'WON';
      // Show modifier choice
      UIShow('choice');
    }
  }

  _computeStars(ml){
    let s = 1;
    if(this.session.moves <= (ml.par_moves || 999)) s++;
    if(this.session.undos <= (ml.par_undos || 999) && this.session.undos === 0) s++;
    else if(this.session.undos <= (ml.par_undos || 999)) s++;
    return Math.min(3, s);
  }
}

/* ============================================================
   JUICE (Layer 7 + juice system)
   ============================================================ */
const Juice = {
  quality: 'med',
  onMove(scene){
    if(this.quality === 'low') return;
    scene.cameras.main.shake(35, 0.0012);
  },
  onPush(scene, sprite){
    if(!sprite) return;
    if(this.quality !== 'low'){
      scene.tweens.add({ targets: sprite, scaleX: 1.15, scaleY: 0.9, duration: 70, yoyo: true });
    }
  },
  onWin(scene){
    if(this.quality === 'low') return;
    scene.cameras.main.flash(180, 120, 180, 255);
    scene.cameras.main.shake(120, 0.004);
  }
};

/* ============================================================
   ACHIEVEMENTS
   ============================================================ */
const Achievements = {
  state: {},
  init(saveData){
    this.state = saveData.meta.achievements || {};
    bus.on('MICRO_PHASE_COMPLETED', ctx => this.evaluate('MICRO_PHASE_COMPLETED', ctx));
    bus.on('STAGE_COMPLETED', ctx => this.evaluate('STAGE_COMPLETED', ctx));
  },
  evaluate(evt, ctx){
    const list = GAME_DATA.progression.achievements || [];
    for(const a of list){
      if(a.condition_event !== evt) continue;
      if(this.state[a.id]) continue;
      let hit = false;
      if(a.condition_fn === 'no_undo' && ctx.session && ctx.session.undos === 0) hit = true;
      if(a.condition_fn === 'under_par' && ctx.ml && ctx.session && ctx.session.moves <= (ctx.ml.par_moves||999)) hit = true;
      if(!a.condition_fn && (a.threshold||1) <= 1) hit = true;
      if(hit){
        this.state[a.id] = true;
        bus.emit('ACHIEVEMENT_UNLOCKED', { id: a.id, name: a.name });
        Toast.show(`🏆 ${a.name}`);
      }
    }
    if(save){ save.data.meta.achievements = this.state; save.save(); }
  }
};

/* ============================================================
   TUTORIAL
   ============================================================ */
const Tutorial = {
  onMicroStart(ml){
    if(!GAME_DATA.progression.tutorial) return;
    const steps = GAME_DATA.progression.tutorial.steps;
    if(!this.playedFirst){
      const s = steps.find(s=>s.trigger==='on_first_micro');
      if(s){ Toast.show(GAME_DATA.theme.texts[s.text_key] || 'Use arrows / swipe to move.'); this.playedFirst = true; }
    }
  },
  onEvent(evt, session){
    if(evt === 'move' && !this.playedPush && session.pushes > 0){
      const s = GAME_DATA.progression.tutorial.steps.find(s=>s.trigger==='first_push');
      if(s){ Toast.show(GAME_DATA.theme.texts[s.text_key] || 'Push blocks onto goals.'); this.playedPush = true; }
    }
  }
};

/* ============================================================
   UI (DOM overlay)
   ============================================================ */
const $ = id => document.getElementById(id);
function UIShow(name){
  ['loading','menu','stage','pause','result','choice','settings','ach','diag'].forEach(k=>{
    const el = $('overlay-'+k); if(el) el.classList.toggle('active', k === name);
  });
  $('hud').classList.toggle('active', name === 'hud');
  $('controls').classList.toggle('active', name === 'hud');
  bus.emit('SCREEN_CHANGED', { screen: name });
}
function Toast_(){}
const Toast = {
  timer: null,
  show(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(this.timer); this.timer = setTimeout(()=> t.classList.remove('show'), 2400);
  }
};
function UIRefreshHUD(){
  if(!GAME) return;
  const stageIdx = GAME.stage ? GAME.stage.stage_id : '-';
  $('hud-stage').textContent = (GAME.constructor.name, (GAME.stage? (GAME.stage.stage_id.replace('stage_','')||'1') : '1'));
  $('hud-micro').textContent = `${(GAME.microIndex||0)+1}/${GAME.stage?.micro_phases?.length||1}`;
  $('hud-moves').textContent = GAME.session?.moves||0;
  $('hud-pushes').textContent = GAME.session?.pushes||0;
  $('hud-undo').textContent = GAME._undoTokens ? GAME._undoTokens() : 0;
}

/* ============================================================
   GAME DATA LOAD
   ============================================================ */
let GAME_DATA = null;
let GAME = null;
let phaserGame = null;

function boot(){
  UIShow('loading');
  const diag = validateGameData(window.GAME_DATA);
  if(!diag.ok){
    // inject synthetics
    GAME_DATA = syntheticGameData();
    const msg = diag.issues.map(i => `[${i.severity}] ${i.msg}`).join('\n');
    $('diag-body').textContent = msg + '\n\nRecovery: using synthetic fallback data.';
    if(window.GAME_DATA){
      // merge partial
      GAME_DATA = Object.assign(GAME_DATA, window.GAME_DATA);
    }
    UIShow('diag');
    return;
  }
  GAME_DATA = window.GAME_DATA || syntheticGameData();
  finishBoot();
}

function finishBoot(){
  // Theme → CSS vars
  const pal = GAME_DATA.theme?.palette || ['#2b3348','#4a83ff','#7be3a4','#f5c76a','#e7ecf5','#c0392b','#1b2030'];
  document.documentElement.style.setProperty('--bg', pal[6] || '#10131a');

  // Register entities
  const ents = GAME_DATA.entities || {};
  const allEnts = [].concat(ents.player_or_core_agent||[], ents.opposing_or_active_forces||[], ents.player_tools_or_actions||[], ents.environment_or_context_entities||[]);
  for(const e of allEnts) registry.set('entities', e.id, e);

  // Rules
  GAME = new Game();
  GAME.ruleEngine.load(GAME_DATA.rules || []);

  // Save
  save = new SaveSystem(GAME_DATA.theme?.save_key || 'logic_sokoban_save_v1', 1);
  save.load();
  Achievements.init(save.data);

  // Settings load
  applySettings(save.data.settings);

  // Input
  bindInput();

  // Phaser
  const parent = $('game-root');
  const cfg = {
    type: Phaser.AUTO,
    parent,
    backgroundColor: pal[6] || '#10131a',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    render: { pixelArt: false, antialias: true },
    scene: []
  };
  phaserGame = new Phaser.Game(cfg);
  GAME.init(phaserGame);
  phaserGame.scene.add('game', GAME.scene, true);

  // UI bindings
  bindUI();

  // First stage load (menu)
  UIShow('menu');
  $('menu-title').textContent = GAME_DATA.theme?.texts?.title || 'Grid Push';
  bus.emit('ENGINE_READY', { version: ENGINE_CONFIG.version });
  bus.emit('GAME_DATA_VALIDATED', { issues: diag_issues_count() });
}

function diag_issues_count(){ return 0; }

/* ============================================================
   INPUT
   ============================================================ */
function bindInput(){
  window.addEventListener('keydown', e=>{
    if(!GAME || GAME.stateFSM.state !== 'PLAYING') {
      if(e.key === 'Escape' && $('overlay-pause').classList.contains('active')) hideAll(); 
      return;
    }
    const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', a:'left', s:'down', d:'right' };
    const dir = map[e.key];
    if(dir){ e.preventDefault(); GAME.attemptMove(dir); }
    else if(e.key === 'z' || e.key === 'Z'){ GAME.undo(); }
    else if(e.key === 'Escape'){ pauseGame(); }
    else if(e.key === 'r' || e.key === 'R'){ restartLevel(); }
  });

  // Swipe
  let sx=0, sy=0, tracking=false;
  window.addEventListener('touchstart', e=>{ if(!e.touches[0]) return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; tracking=true; }, {passive:true});
  window.addEventListener('touchend', e=>{
    if(!tracking || !e.changedTouches[0]) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    tracking=false;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if(Math.max(ax,ay) < 24) return;
    if(!GAME || GAME.stateFSM.state !== 'PLAYING') return;
    if(ax > ay) GAME.attemptMove(dx > 0 ? 'right' : 'left');
    else GAME.attemptMove(dy > 0 ? 'down' : 'up');
  }, {passive:true});

  // D-pad buttons
  document.querySelectorAll('[data-dir]').forEach(b=>{
    b.addEventListener('click', ()=>{ if(GAME) GAME.attemptMove(b.dataset.dir); });
  });
  document.querySelectorAll('[data-cmd="undo"]').forEach(b=>{
    b.addEventListener('click', ()=>{ if(GAME) GAME.undo(); });
  });
}

/* ============================================================
   UI BINDINGS
   ============================================================ */
function hideAll(){ UIShow('hud'); }
function pauseGame(){ UIShow('pause'); bus.emit('GAMEPLAY_STOP'); }
function restartLevel(){ if(GAME && GAME.level) GAME.loadMicro(GAME.level); }
function quitToMenu(){ UIShow('menu'); bus.emit('GAMEPLAY_STOP'); }

function bindUI(){
  $('btn-play').onclick = () => { UIShow('stage'); renderStageList(); };
  $('btn-endless').onclick = () => { Toast.show('Endless mode: procedurally generated puzzles (stub in this build).'); };
  $('btn-settings').onclick = () => { UIShow('settings'); };
  $('btn-ach').onclick = () => { renderAchList(); UIShow('ach'); };
  $('btn-settings-close').onclick = () => { saveSettings(); UIShow('menu'); };
  $('btn-ach-close').onclick = () => { UIShow('menu'); };
  $('btn-back-menu').onclick = () => UIShow('menu');
  $('btn-resume').onclick = () => UIShow('hud');
  $('btn-restart').onclick = () => { restartLevel(); UIShow('hud'); };
  $('btn-pause-settings').onclick = () => { UIShow('settings'); };
  $('btn-quit').onclick = () => quitToMenu();
  $('btn-res-next').onclick = () => { UIShow('hud'); };
  $('btn-res-retry').onclick = () => { restartLevel(); UIShow('hud'); };
  $('btn-res-menu').onclick = () => quitToMenu();
  $('btn-diag-close').onclick = () => { finishBoot(); };

  // Settings inputs
  $('s-music').oninput = e => { save.data.settings.music = e.target.value/100; applySettings(save.data.settings); };
  $('s-sfx').oninput = e => { save.data.settings.sfx = e.target.value/100; applySettings(save.data.settings); };
  $('s-fx').onchange = e => { save.data.settings.fx = e.target.value; applySettings(save.data.settings); };

  // Modifier choice
  bus.on('STAGE_COMPLETED', () => renderModifierChoices());
}

function renderStageList(){
  const list = $('stage-list');
  list.innerHTML = '';
  const stages = GAME_DATA.progression.stages;
  stages.forEach((s, idx)=>{
    const div = document.createElement('div');
    div.className = 'choice-card';
    const clearCount = (s.micro_phases||[]).filter(m=> save.data.progression.completedMicros[m.micro_level_id]).length;
    div.innerHTML = `<h3>${idx+1}. ${s.name}</h3><p>${clearCount}/${(s.micro_phases||[]).length} puzzles cleared</p>`;
    div.onclick = () => { GAME.loadStage(idx); UIShow('hud'); };
    list.appendChild(div);
  });
}

function renderAchList(){
  const list = $('ach-list');
  list.innerHTML = '';
  const ach = GAME_DATA.progression.achievements || [];
  ach.forEach(a=>{
    const row = document.createElement('div');
    row.className = 'settings-row';
    const unlocked = save.data.meta.achievements[a.id] ? '✅' : '🔒';
    row.innerHTML = `<label>${unlocked} ${a.name || a.id}</label>`;
    list.appendChild(row);
  });
}

function renderModifierChoices(){
  const pool = GAME_DATA.progression.choice_pool || [];
  const pick = pool.slice(0, 3);
  const box = $('choice-list');
  box.innerHTML = '';
  pick.forEach(m=>{
    const card = document.createElement('div');
    card.className = 'choice-card';
    card.innerHTML = `<h3>${m.name}</h3><p>${JSON.stringify(m.modifier)}</p>`;
    card.onclick = () => {
      modifiers.add({ ...m.modifier, duration: 0 });
      save.data.activeModifiers.push(m.id);
      save.save();
      Toast.show(`Applied: ${m.name}`);
      // load next stage
      const idx = GAME_DATA.progression.stages.findIndex(s=>s.stage_id === GAME.stage.stage_id);
      const next = GAME_DATA.progression.stages[idx+1];
      if(next){ GAME.loadStage(idx+1); UIShow('hud'); }
      else { Toast.show('All stages cleared!'); UIShow('menu'); }
    };
    box.appendChild(card);
  });
}

function applySettings(s){
  Juice.quality = s.fx || 'med';
  if(save){ save.data.settings = s; save.save(); }
  // music/sfx would be applied to Phaser audio manager when music is provided
}

function saveSettings(){
  applySettings(save.data.settings);
}

/* ============================================================
   DEBUG
   ============================================================ */
if(ENGINE_CONFIG.debug){
  window.__DEBUG = { GAME: ()=>GAME, registry, bus, modifiers, ENGINE_CONFIG };
  window.addEventListener('load', ()=>{
    const p = document.createElement('div');
    p.id = 'debug-panel';
    p.innerHTML = `<button onclick="console.log(__DEBUG.GAME())">log state</button>`;
    document.body.appendChild(p);
  });
}

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('load', boot);
</script>
